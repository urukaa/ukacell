name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: "27.3.13750724"
    defaults:
      run:
        shell: bash
        working-directory: apps/host

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Full history and tags, for the commit list in the release notes.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/host/src-tauri -> target

      - name: Install npm dependencies
        working-directory: .
        run: npm install --no-audit --no-fund

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version (expected tags like v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version into tauri.conf.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Generate the Android project (if not committed)
        run: |
          if [[ -d src-tauri/gen/android ]]; then
            echo "src-tauri/gen/android already exists, skipping init"
          else
            npm run tauri -- android init --ci
          fi

      - name: Generate icons
        run: npm run tauri -- icon app-icon.png

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          KEYSTORE_FILE="${KEYSTORE_DIR}/ukacell-release.jks"
          mkdir -p "$KEYSTORE_DIR"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="${ANDROID_KEY_ALIAS:-ukacell}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, signing with a throwaway key. Users will have to uninstall before installing the next release. See README > Releasing."
            PASSWORD="$(openssl rand -hex 24)"
            ALIAS="ukacell"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=Ukacell CI, O=Ukacell, C=US"
          fi
          echo "::add-mask::$PASSWORD"
          {
            echo "password=$PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "storeFile=$KEYSTORE_FILE"
          } > src-tauri/gen/android/keystore.properties

      - name: Patch AndroidManifest.xml and Gradle
        run: node scripts/patch-android.mjs

      - name: Build universal APK
        # Stronghold is an optional feature: libsodium only cross-compiles for
        # Android from Linux/macOS, so release builds turn it on here.
        run: npm run tauri -- android build --apk --features stronghold

      - name: Collect APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "::error::No APK found in $APK_DIR"
            ls -R src-tauri/gen/android/app/build/outputs || true
            exit 1
          fi
          OUT_DIR="${GITHUB_WORKSPACE}/dist"
          OUT="${OUT_DIR}/ukacell-${VERSION}-universal.apk"
          mkdir -p "$OUT_DIR"
          cp "$APK" "$OUT"
          (cd "$OUT_DIR" && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built $OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ukacell-${{ steps.version.outputs.version }}-apk
          path: dist/*
          if-no-files-found: error

      # The launcher shows these notes in its update and "what's new" sheets.
      # GitHub's generated notes only list pull requests, so commits pushed
      # straight to main are listed here.
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "$PREVIOUS" ]]; then
            RANGE="${PREVIOUS}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          COMMITS="$(git log --no-merges --pretty='* %s' "$RANGE")"
          if [[ -n "$COMMITS" ]]; then
            printf "## What's new\n%s\n" "$COMMITS" > "$NOTES"
          else
            : > "$NOTES"
          fi
          echo "Release notes (${RANGE}):"
          cat "$NOTES"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Ukacell ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
